<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Smile Dental Center | Monterrey</title>
  <style>
    :root {
      --bg: #f7f9fb;
      --text: #1c2733;
      --muted: #5b6b7a;
      --accent: #0e7c86;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(14,124,134,0.55), rgba(14,124,134,0.75)), url('hero-pro-smile.jpg') center/cover no-repeat;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .hero img.logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin: 0 0 0.5rem;
    }
    .hero p {
      font-size: 1.1rem;
      max-width: 32rem;
      margin: 0 auto;
      opacity: 0.95;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .status {
      background: #fff;
      border: 1px solid #e1e7ec;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div>
      <img class="logo" src="LOGO.jpg" alt="Pro Smile Dental Center">
      <h1>Pro Smile Dental Center</h1>
      <p>Cuidado dental de calidad en Monterrey. Sitio en construcción.</p>
    </div>
  </section>

  <main>
    <div class="status">
      Este sitio está en desarrollo y se publica automáticamente en GitHub Pages
      con cada actualización. Vuelve pronto para ver el sitio completo.
    </div>
  </main>

  <footer>
    &copy; 2026 Pro Smile Dental Center &middot; Monterrey, México
  </footer>
</body>
</html>
